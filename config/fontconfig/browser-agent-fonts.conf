<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">../../assets/fonts</dir>

  <alias binding="strong">
    <family>Arial</family>
    <prefer><family>Inter Variable</family></prefer>
  </alias>

  <alias binding="strong">
    <family>Arial Unicode MS</family>
    <prefer><family>Inter Variable</family></prefer>
  </alias>

  <alias binding="strong">
    <family>Helvetica</family>
    <prefer><family>Inter Variable</family></prefer>
  </alias>

  <alias binding="strong">
    <family>Helvetica Neue</family>
    <prefer><family>Inter Variable</family></prefer>
  </alias>

  <match target="pattern">
    <test name="family" qual="any" compare="eq">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Inter Variable</string>
      <string>Noto Sans JP</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any" compare="eq">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Inter Variable</string>
      <string>Noto Sans JP</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ja</string>
    </test>
    <test name="family" qual="any" compare="eq">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="assign_replace" binding="strong">
      <string>Noto Sans JP</string>
      <string>Inter Variable</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ja</string>
    </test>
    <test name="family" qual="any" compare="eq">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="assign_replace" binding="strong">
      <string>Noto Sans JP</string>
      <string>Inter Variable</string>
    </edit>
  </match>
</fontconfig>
